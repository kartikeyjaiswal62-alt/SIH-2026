version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=lrip-secret-key-gov-digitization-2026-secure
      - DATABASE_URL=sqlite:////app/storage/lrip.db
      - LLM_PROVIDER=mock
      - LLM_API_KEY=
      - LLM_MODEL=gpt-4o
    volumes:
      - backend_storage:/app/storage
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_storage:
